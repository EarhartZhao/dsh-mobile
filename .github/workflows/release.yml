name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Android release
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
      NATS_SERVER_BIN: /usr/local/bin/nats-server
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install NATS server
        run: |
          set -euo pipefail
          version=2.14.6
          work="$RUNNER_TEMP/nats-server"
          mkdir -p "$work"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${version}/nats-server-v${version}-linux-amd64.tar.gz" | tar -xz -C "$work" --strip-components=1
          sudo install -m 0755 "$work/nats-server" /usr/local/bin/nats-server
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Make Gradle wrapper executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-version.mjs check "${GITHUB_REF_NAME}"
      - name: Verify vendored protocol
        run: pnpm run sync-protocol:check
      - name: Typecheck and test workspace
        run: |
          pnpm run typecheck
          pnpm run test
      - name: Verify app
        working-directory: apps/mobile
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test
      - name: Prepare signing key
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > apps/mobile/android/release.keystore
          cat > apps/mobile/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
      - name: Build signed release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Resolve release version
        id: release
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/mobile/package.json').version")"
          if [[ "${GITHUB_REF_NAME:-}" == v* && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Rename release APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "DshMobile-v${{ steps.release.outputs.version }}-release.apk"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-release-apk
          path: DshMobile-v${{ steps.release.outputs.version }}-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          tag="v${version}"
          apk="DshMobile-v${version}-release.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "dsh-mobile v${version}" --generate-notes
          fi
