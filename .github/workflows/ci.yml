name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
      NATS_SERVER_BIN: /usr/local/bin/nats-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install NATS server
        run: |
          set -euo pipefail
          version=2.14.6
          work="$RUNNER_TEMP/nats-server"
          mkdir -p "$work"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${version}/nats-server-v${version}-linux-amd64.tar.gz" | tar -xz -C "$work" --strip-components=1
          sudo install -m 0755 "$work/nats-server" /usr/local/bin/nats-server
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check vendored protocol
        run: pnpm run sync-protocol:check
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Test workspace
        run: pnpm run test
      - name: Typecheck app
        working-directory: apps/mobile
        run: pnpm run typecheck
      - name: Lint app
        working-directory: apps/mobile
        run: pnpm run lint
      - name: Test app
        working-directory: apps/mobile
        run: pnpm run test

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: verify
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Make Gradle wrapper executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
