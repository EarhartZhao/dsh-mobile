# Local stand-in for the Hub during LAN e2e (before the real Hub gets its
# wss:8443 listener). The plugin dials nats://demo:demo@127.0.0.1:4222; the
# app (emulator) dials ws://demo:demo@10.0.2.2:8443 via the pairing QR.
# Loopback test rig: no server-level auth (the real ACL wall lives on the
# Hub; the app still sends its QR credentials, ignored here).
port: 4222
server_name: local-standin

websocket {
  port: 8443
  no_tls: true
}
